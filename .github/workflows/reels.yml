# Montador de reels da Agência RCA: a cada 20 min pergunta ao admin se tem
# reels para montar. Também dá para rodar na mão (Actions > Montar reels > Run workflow).
name: Montar reels
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/reels.yml", "montar.py", "musica.py"]
concurrency:
  group: reels
  cancel-in-progress: false
jobs:
  montar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # 05/11/2026: pergunta a fila antes de instalar nada (rodada vazia termina em segundos)
      - name: Tem reels na fila?
        id: fila
        env:
          RCA_REELS_TOKEN: ${{ secrets.RCA_REELS_TOKEN }}
        run: |
          n=$(curl -s --max-time 60 -H "X-Reels-Token: $RCA_REELS_TOKEN" "https://agenciarca.com.br/portal-admin/api/reels.php?acao=fila&so_contar=1" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("trabalhos") or []))' || echo 1)
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "$n na fila"
      - name: ffmpeg
        if: steps.fila.outputs.n != '0'
        run: |
          # mesmo ffmpeg do teste (Ubuntu); o estático baixado de fora quebrava o drawtext
          # 05/11/2026: o espelho do apt às vezes trava; até 3 tentativas de 4 min antes de desistir
          for i in 1 2 3; do
            command -v ffmpeg >/dev/null && break
            sudo timeout 240 apt-get update -qq || true
            sudo timeout 240 apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null && break
            echo "apt falhou (tentativa $i)"; sleep 20
          done
          ffmpeg -version | head -1
        timeout-minutes: 14
      - name: numpy (trilha composta)
        if: steps.fila.outputs.n != '0'
        run: python3 -c "import numpy" 2>/dev/null || sudo apt-get install -y -qq --no-install-recommends python3-numpy >/dev/null || python3 -m pip install --user -q numpy
        timeout-minutes: 6
      - name: Montar
        if: steps.fila.outputs.n != '0'
        env:
          RCA_REELS_TOKEN: ${{ secrets.RCA_REELS_TOKEN }}
          RCA_BASE: ${{ vars.RCA_BASE || 'https://agenciarca.com.br' }}
        run: python3 montar.py
