# Montador de reels da Agência RCA: a cada 20 min pergunta ao admin se tem
# reels para montar. Também dá para rodar na mão (Actions > Montar reels > Run workflow).
name: Montar reels
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/reels.yml", "montar.py"]
concurrency:
  group: reels
  cancel-in-progress: false
jobs:
  montar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: |
          # mesmo ffmpeg do teste (Ubuntu); o estático baixado de fora quebrava o drawtext
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null
          fi
          ffmpeg -version | head -1
        timeout-minutes: 12
      - name: Montar
        env:
          RCA_REELS_TOKEN: ${{ secrets.RCA_REELS_TOKEN }}
          RCA_BASE: ${{ vars.RCA_BASE || 'https://agenciarca.com.br' }}
        run: python3 montar.py
