# Montador de reels da Agência RCA: a cada 20 min pergunta ao admin se tem
# reels para montar. Também dá para rodar na mão (Actions > Montar reels > Run workflow).
name: Montar reels
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/reels.yml", "montar.py"]
concurrency:
  group: reels
  cancel-in-progress: false
jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            curl -sSL --retry 3 -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            echo "/tmp/ff" >> "$GITHUB_PATH"
          fi
        timeout-minutes: 5
      - name: Montar
        env:
          RCA_REELS_TOKEN: ${{ secrets.RCA_REELS_TOKEN }}
          RCA_BASE: ${{ vars.RCA_BASE || 'https://agenciarca.com.br' }}
        run: python3 montar.py
