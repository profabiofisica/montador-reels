# Estúdio RCA: renderiza o Reels de teste (tests/estudio-teste.json) e guarda o MP4 nos artefatos.
name: Estúdio (teste)
on:
  workflow_dispatch: {}
jobs:
  teste:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: estudio/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: estudio-whisper-v1
      - run: |
          cd estudio && npm ci --no-audit --no-fund && npx remotion browser ensure
          python3 -m pip install --user -q --break-system-packages faster-whisper
      - run: python3 estudio.py --teste tests/estudio-teste.json
      - uses: actions/upload-artifact@v4
        with:
          name: estudio-teste
          path: |
            /tmp/estudio-teste.mp4
            /tmp/estudio-capa.jpg
